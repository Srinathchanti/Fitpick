<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>FitPick — Your AI Stylist</title>
<meta name="description" content="FitPick: an AI-styled digital closet. Catalog your wardrobe and get outfit suggestions scored on color, occasion, style, formality and weather." />
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>👕</text></svg>">
<style>
/* ============================= Design tokens ============================= */
:root, [data-theme="dark"]{
  --bg:#08080d; --surface:#101018; --surface2:#1a1a25; --surface3:#22222f;
  --fg:#f4f4f7; --muted:#a0a0ae; --faint:#676774;
  --line:rgba(255,255,255,.075); --line-strong:rgba(255,255,255,.14);
  --accent:#8b7cf6; --accent2:#c084fc;
  --danger:#f87171; --success:#34d399; --warn:#fbbf24;
  color-scheme:dark;
}
[data-theme="light"]{
  --bg:#f3f3f8; --surface:#ffffff; --surface2:#eceef4; --surface3:#e2e4ee;
  --fg:#14141c; --muted:#5b5b6b; --faint:#9a9aa9;
  --line:rgba(18,18,32,.09); --line-strong:rgba(18,18,32,.16);
  --accent:#6d5cf0; --accent2:#a855f7;
  --danger:#dc2626; --success:#0d9d6c; --warn:#b45309;
  color-scheme:light;
}
*{box-sizing:border-box;}
html{-webkit-tap-highlight-color:transparent; scroll-padding-top:env(safe-area-inset-top,0px);}
html,body{height:100%;}
body{
  margin:0; background:var(--bg); color:var(--fg);
  font-family:'Inter',ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility; min-height:100dvh;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
body::before{
  content:""; position:fixed; inset:0; pointer-events:none; z-index:0;
  background:
    radial-gradient(60% 40% at 15% -10%, color-mix(in oklab, var(--accent) 9%, transparent), transparent 70%),
    radial-gradient(50% 35% at 95% 0%, color-mix(in oklab, var(--accent2) 7%, transparent), transparent 70%);
}
::selection{ background:color-mix(in oklab, var(--accent) 40%, transparent); }
*:focus-visible{ outline:2px solid color-mix(in oklab, var(--accent) 70%, transparent); outline-offset:2px; }
a{ color:inherit; text-decoration:none; }
button{ font:inherit; color:inherit; }
img{ display:block; }
h1,h2,h3,p{ margin:0; }

.gradient-accent{ background:linear-gradient(135deg, var(--accent), var(--accent2)); }
.text-gradient{
  background:linear-gradient(135deg, var(--accent), var(--accent2));
  -webkit-background-clip:text; background-clip:text; color:transparent;
}

/* ============================= Layout shell ============================= */
#app{ position:relative; z-index:10; }
.rail{
  position:fixed; inset-block:0; left:0; z-index:40; width:84px;
  display:none; flex-direction:column; align-items:center;
  border-right:1px solid var(--line); background:color-mix(in oklab, var(--bg) 60%, transparent);
  backdrop-filter:blur(20px); padding:24px 0;
}
.rail-logo{ display:flex; align-items:center; justify-content:center; }
.rail-nav{ margin-top:40px; display:flex; flex-direction:column; gap:6px; }
.rail-item{
  width:64px; height:64px; border-radius:18px; display:flex; flex-direction:column;
  align-items:center; justify-content:center; gap:4px; color:var(--muted);
  transition:all .2s ease; cursor:pointer; border:0; background:transparent;
}
.rail-item:hover{ background:var(--surface2); color:var(--fg); }
.rail-item.active{ background:linear-gradient(135deg, var(--accent), var(--accent2)); color:#fff; box-shadow:0 10px 24px -8px color-mix(in oklab, var(--accent) 55%, transparent); }
.rail-item span{ font-size:10px; font-weight:600; }
.rail-bottom{ margin-top:auto; }

.topbar{
  position:sticky; top:0; z-index:40; border-bottom:1px solid var(--line);
  background:color-mix(in oklab, var(--bg) 70%, transparent); backdrop-filter:blur(20px);
}
.topbar-inner{ display:flex; align-items:center; justify-content:space-between; height:56px; padding:0 20px; }
.logo{ display:flex; align-items:center; gap:10px; font-weight:800; font-size:17px; letter-spacing:-.01em; }
.logo .mark{ width:34px; height:34px; border-radius:11px; display:grid; place-items:center; color:#fff; box-shadow:0 8px 18px -6px color-mix(in oklab, var(--accent) 60%, transparent); }

main{ position:relative; z-index:10; }
.main-inner{ margin:0 auto; width:100%; max-width:720px; padding:20px 18px 130px; }
@media (min-width:768px){
  .rail{ display:flex; }
  .topbar{ display:none; }
  main{ padding-left:84px; }
  .main-inner{ max-width:900px; padding:36px 40px 56px; }
}

.bottomnav{ position:fixed; inset-inline:16px; bottom:calc(16px + env(safe-area-inset-bottom,0px)); z-index:40; }
@media (min-width:768px){ .bottomnav{ display:none; } }
.bottomnav-inner{
  display:flex; align-items:stretch; justify-content:space-between; padding:6px;
  border-radius:28px; background:color-mix(in oklab, var(--surface) 68%, transparent);
  backdrop-filter:blur(22px) saturate(160%); border:1px solid var(--line);
  box-shadow:0 20px 45px -12px rgba(0,0,0,.4);
}
.bn-item{
  flex:1; min-width:56px; display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:2px; padding:8px 0; border-radius:16px; color:var(--muted); border:0; background:transparent; cursor:pointer;
}
.bn-item.active{ color:var(--accent); }
.bn-item span{ font-size:10px; font-weight:600; }
.bn-item.accent{
  flex:0 0 56px; margin-top:-24px; height:56px; border-radius:20px; color:#fff;
  background:linear-gradient(135deg, var(--accent), var(--accent2));
  box-shadow:0 14px 30px -8px color-mix(in oklab, var(--accent) 65%, transparent);
  display:flex; align-items:center; justify-content:center;
}

/* ============================= Primitives ============================= */
.card{ background:var(--surface); border:1px solid var(--line); border-radius:22px; padding:20px; }
.card.pad-0{ padding:0; }
.section-title{ display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }
.section-title h2{ font-size:13px; font-weight:700; color:var(--muted); text-transform:none; letter-spacing:.01em; }

.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:8px; cursor:pointer;
  border-radius:14px; border:1px solid transparent; font-weight:700; font-size:14px;
  padding:11px 18px; transition:transform .12s ease, opacity .12s ease, background .15s ease; white-space:nowrap;
}
.btn:active{ transform:scale(.97); }
.btn:disabled{ opacity:.55; cursor:not-allowed; transform:none; }
.btn-primary{ background:linear-gradient(135deg, var(--accent), var(--accent2)); color:#fff; box-shadow:0 10px 24px -8px color-mix(in oklab, var(--accent) 55%, transparent); }
.btn-secondary{ background:var(--surface2); color:var(--fg); border-color:var(--line-strong); }
.btn-ghost{ background:transparent; color:var(--muted); }
.btn-ghost:hover{ color:var(--fg); }
.btn-danger{ background:color-mix(in oklab, var(--danger) 14%, transparent); color:var(--danger); }
.btn-lg{ padding:14px 20px; font-size:15px; border-radius:16px; }
.btn-sm{ padding:7px 12px; font-size:12.5px; border-radius:11px; }
.btn-block{ width:100%; }
.btn-icon{ width:40px; height:40px; padding:0; border-radius:50%; }

.chip{
  display:inline-flex; align-items:center; gap:6px; padding:9px 14px; border-radius:999px;
  border:1px solid var(--line); background:var(--surface); color:var(--muted); font-size:13px;
  font-weight:600; cursor:pointer; white-space:nowrap; transition:all .15s ease; user-select:none;
}
.chip:hover{ border-color:color-mix(in oklab, var(--accent) 40%, transparent); color:var(--fg); }
.chip.selected{ border-color:transparent; background:linear-gradient(135deg, var(--accent), var(--accent2)); color:#fff; box-shadow:0 8px 18px -6px color-mix(in oklab, var(--accent) 50%, transparent); }
.chip.small{ padding:6px 11px; font-size:12px; }

.badge{ display:inline-flex; align-items:center; gap:5px; padding:5px 10px; border-radius:999px; font-size:11.5px; font-weight:700; }
.badge-success{ background:color-mix(in oklab, var(--success) 16%, transparent); color:var(--success); }
.badge-accent{ background:color-mix(in oklab, var(--accent) 18%, transparent); color:var(--accent); }
.badge-neutral{ background:var(--surface2); color:var(--muted); }
.badge-warn{ background:color-mix(in oklab, var(--warn) 18%, transparent); color:var(--warn); }
.badge-danger{ background:color-mix(in oklab, var(--danger) 16%, transparent); color:var(--danger); }

label.field-label{ display:block; font-size:12.5px; font-weight:700; color:var(--muted); margin:0 0 7px 2px; }
.input, select.input, textarea.input{
  width:100%; background:var(--surface2); border:1px solid var(--line-strong); color:var(--fg);
  border-radius:13px; padding:11px 13px; font-size:14.5px; font-family:inherit;
}
textarea.input{ resize:vertical; min-height:74px; }
.input:focus{ border-color:var(--accent); }
.field{ margin-bottom:16px; }
.hint{ font-size:12px; color:var(--faint); margin-top:6px; }

.swatch-row{ display:flex; flex-wrap:wrap; gap:9px; }
.swatch{
  width:34px; height:34px; border-radius:50%; border:2px solid var(--line-strong); cursor:pointer;
  display:grid; place-items:center; transition:transform .12s ease;
}
.swatch:hover{ transform:scale(1.08); }
.swatch.selected{ border-color:var(--fg); box-shadow:0 0 0 2px var(--bg), 0 0 0 4px var(--accent); }
.swatch.selected::after{ content:"✓"; font-size:13px; font-weight:900; color:#fff; text-shadow:0 1px 2px rgba(0,0,0,.5); }

.skel{ border-radius:20px; background:linear-gradient(100deg, var(--surface2) 30%, var(--surface3) 45%, var(--surface2) 60%); background-size:200% 100%; animation:skel 1.3s ease-in-out infinite; }
@keyframes skel{ from{background-position:150% 0;} to{background-position:-50% 0;} }

.empty{ text-align:center; padding:48px 20px; }
.empty .ico{ width:64px; height:64px; margin:0 auto 16px; border-radius:20px; background:var(--surface2); display:grid; place-items:center; color:var(--faint); }
.empty h3{ font-size:16px; font-weight:800; margin-bottom:6px; }
.empty p{ font-size:13.5px; color:var(--muted); max-width:320px; margin:0 auto 18px; line-height:1.55; }

.grid-cats{ display:grid; grid-template-columns:repeat(3,1fr); gap:9px; }
@media (min-width:480px){ .grid-cats{ grid-template-columns:repeat(4,1fr);} }
.cat-btn{
  display:flex; flex-direction:column; align-items:center; gap:7px; padding:14px 8px;
  border-radius:18px; border:1px solid var(--line); background:var(--surface); color:var(--muted);
  cursor:pointer; transition:all .15s ease;
}
.cat-btn.active{ border-color:transparent; background:linear-gradient(135deg, var(--accent), var(--accent2)); color:#fff; box-shadow:0 10px 22px -8px color-mix(in oklab, var(--accent) 50%, transparent); }
.cat-btn span{ font-size:11.5px; font-weight:700; }

.scrollx{ display:flex; gap:8px; overflow-x:auto; padding-bottom:2px; scrollbar-width:none; }
.scrollx::-webkit-scrollbar{ display:none; }

/* closet grid */
.item-grid{ display:grid; grid-template-columns:repeat(2,1fr); gap:12px; }
@media (min-width:560px){ .item-grid{ grid-template-columns:repeat(3,1fr);} }
@media (min-width:900px){ .item-grid{ grid-template-columns:repeat(4,1fr);} }
.item-tile{ cursor:pointer; }
.item-thumb{ position:relative; aspect-ratio:3/4; border-radius:18px; overflow:hidden; background:var(--surface2); border:1px solid var(--line); }
.item-thumb img{ width:100%; height:100%; object-fit:cover; }
.item-fav{ position:absolute; top:8px; right:8px; width:28px; height:28px; border-radius:50%; background:rgba(10,10,16,.55); backdrop-filter:blur(6px); display:grid; place-items:center; color:#fff; }
.item-status{ position:absolute; bottom:8px; left:8px; }
.item-tile p.name{ margin-top:8px; font-size:12.5px; font-weight:700; }
.item-tile p.sub{ font-size:11px; color:var(--faint); margin-top:1px; }

/* outfit visual */
.outfit-visual{ display:flex; gap:9px; }
.outfit-slot{ min-width:0; flex:1; }
.outfit-slot .thumb{ aspect-ratio:3/4; border-radius:16px; overflow:hidden; background:var(--surface2); border:1px solid var(--line); }
.outfit-slot .thumb img{ width:100%; height:100%; object-fit:cover; }
.outfit-slot p{ margin-top:6px; font-size:10.5px; font-weight:600; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.thumbstrip{ display:flex; }
.thumbstrip .t{ width:42px; height:42px; border-radius:12px; overflow:hidden; border:2px solid var(--surface); background:var(--surface2); margin-left:-10px; }
.thumbstrip .t:first-child{ margin-left:0; }
.thumbstrip img{ width:100%; height:100%; object-fit:cover; }

.divider{ height:1px; background:var(--line); margin:18px 0; border:0; }

/* sheet / modal */
.overlay{ position:fixed; inset:0; z-index:100; background:rgba(6,6,10,.6); backdrop-filter:blur(3px); display:flex; align-items:flex-end; justify-content:center; }
@media (min-width:640px){ .overlay{ align-items:center; } }
.sheet{ width:100%; max-width:520px; max-height:88dvh; overflow-y:auto; background:var(--surface); border:1px solid var(--line); border-radius:26px 26px 0 0; padding:22px 20px calc(22px + env(safe-area-inset-bottom,0px)); animation:sheetup .22s ease; }
@media (min-width:640px){ .sheet{ border-radius:24px; margin-bottom:24px; } }
@keyframes sheetup{ from{ transform:translateY(24px); opacity:0;} to{ transform:translateY(0); opacity:1;} }
.sheet-handle{ width:36px; height:4px; border-radius:99px; background:var(--line-strong); margin:0 auto 16px; }
.sheet-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; }
.sheet-head h3{ font-size:17px; font-weight:800; }

/* toast */
#toasts{ position:fixed; left:50%; transform:translateX(-50%); bottom:calc(96px + env(safe-area-inset-bottom,0px)); z-index:200; display:flex; flex-direction:column; gap:8px; align-items:center; pointer-events:none; }
@media (min-width:768px){ #toasts{ bottom:32px; } }
.toast{ pointer-events:auto; background:var(--fg); color:var(--bg); font-size:13.5px; font-weight:600; padding:11px 18px; border-radius:14px; box-shadow:0 14px 30px -8px rgba(0,0,0,.4); animation:toastin .2s ease; }
@keyframes toastin{ from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);} }

/* score ring / breakdown bar */
.scorebar{ height:6px; border-radius:99px; background:var(--surface2); overflow:hidden; }
.scorebar > div{ height:100%; border-radius:99px; background:linear-gradient(90deg, var(--accent), var(--accent2)); }

/* animations */
.fade-up{ animation:fadeup .28s ease; }
@keyframes fadeup{ from{ opacity:0; transform:translateY(6px);} to{ opacity:1; transform:translateY(0);} }
@media (prefers-reduced-motion:reduce){ *{ animation-duration:.001s !important; transition-duration:.001s !important; } }

.stat-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
.stat-card{ background:var(--surface2); border-radius:16px; padding:14px 12px; text-align:center; }
.stat-card .n{ font-size:20px; font-weight:800; }
.stat-card .l{ font-size:10.5px; color:var(--muted); font-weight:600; margin-top:2px; }

.row{ display:flex; align-items:center; gap:10px; }
.between{ justify-content:space-between; }
.wrap{ flex-wrap:wrap; }
.grow{ flex:1; min-width:0; }
.muted{ color:var(--muted); }
.faint{ color:var(--faint); }
.small{ font-size:12.5px; }
.tiny{ font-size:11px; }
.bold{ font-weight:700; }
.mt-4{ margin-top:16px; } .mt-2{ margin-top:8px;} .mt-6{ margin-top:24px; }

.icon{ display:inline-flex; }
svg.i{ width:1em; height:1em; stroke:currentColor; fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }

.avatar{ width:42px; height:42px; border-radius:14px; display:grid; place-items:center; color:#fff; font-weight:800; font-size:15px; }
.camera-frame{ position:relative; width:100%; aspect-ratio:3/4; background:#000; border-radius:20px; overflow:hidden; }
.camera-frame video, .camera-frame img{ width:100%; height:100%; object-fit:cover; }
.dropzone{ border:1.5px dashed var(--line-strong); border-radius:20px; padding:32px 16px; text-align:center; cursor:pointer; background:var(--surface2); }
.dropzone:hover{ border-color:var(--accent); }

/* ============================= Authentication ============================= */
.auth-wrap{
  position:relative; z-index:20; min-height:100dvh; display:grid; place-items:center;
  padding:28px 18px calc(28px + env(safe-area-inset-bottom,0px));
}
.auth-card{
  width:100%; max-width:420px; background:var(--surface); border:1px solid var(--line);
  border-radius:28px; padding:28px 24px; box-shadow:0 28px 70px -28px rgba(0,0,0,.65);
}
.auth-brand{ display:flex; flex-direction:column; align-items:center; text-align:center; margin-bottom:24px; }
.auth-brand .mark{ width:54px; height:54px; border-radius:18px; display:grid; place-items:center; color:#fff; margin-bottom:12px; }
.auth-brand h1{ font-size:26px; font-weight:850; letter-spacing:-.02em; }
.auth-brand p{ margin-top:6px; color:var(--muted); font-size:13.5px; line-height:1.5; }
.auth-tabs{ display:grid; grid-template-columns:1fr 1fr; gap:6px; padding:5px; border-radius:15px; background:var(--surface2); margin-bottom:20px; }
.auth-tab{ border:0; background:transparent; color:var(--muted); border-radius:11px; padding:9px 10px; font-weight:750; cursor:pointer; }
.auth-tab.active{ background:var(--surface); color:var(--fg); box-shadow:0 4px 16px rgba(0,0,0,.16); }
.auth-msg{ border-radius:13px; padding:10px 12px; margin-bottom:14px; font-size:12.5px; line-height:1.45; }
.auth-msg.error{ color:var(--danger); background:color-mix(in oklab, var(--danger) 12%, transparent); border:1px solid color-mix(in oklab, var(--danger) 22%, transparent); }
.auth-msg.success{ color:var(--success); background:color-mix(in oklab, var(--success) 12%, transparent); border:1px solid color-mix(in oklab, var(--success) 22%, transparent); }
.auth-row{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin-top:-6px; margin-bottom:14px; }
.auth-link{ border:0; background:transparent; padding:0; color:var(--accent); font-size:12.5px; font-weight:700; cursor:pointer; }
.auth-foot{ text-align:center; margin-top:16px; color:var(--faint); font-size:11.5px; line-height:1.5; }
.auth-loading{ min-height:100dvh; display:grid; place-items:center; position:relative; z-index:20; }
.auth-spinner{ width:34px; height:34px; border-radius:50%; border:3px solid var(--line-strong); border-top-color:var(--accent); animation:authspin .8s linear infinite; margin:0 auto 12px; }
@keyframes authspin{ to{ transform:rotate(360deg);} }
.account-row{ display:flex; align-items:center; justify-content:space-between; gap:12px; padding:10px 0; border-bottom:1px solid var(--line); }
.account-row:last-child{ border-bottom:0; }

</style>
</head>
<body>
<div id="app"></div>
<div id="toasts"></div>
<div id="sheet-root"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
"use strict";

/* =========================================================================
   Authentication — Supabase email/password.
   Replace the two public values below with your Supabase project values.
   NEVER place a service_role key in this file.
   ========================================================================= */
const SUPABASE_URL = "https://tsrmthpmpgfgipklbglm.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_QPDkTEhDTgHTJbxqairAtw_UnBVRRru";
const SUPABASE_CONFIGURED =
  SUPABASE_URL.startsWith("https://") &&
  !SUPABASE_URL.includes("YOUR_SUPABASE") &&
  SUPABASE_ANON_KEY &&
  !SUPABASE_ANON_KEY.includes("YOUR_SUPABASE");

const SB = SUPABASE_CONFIGURED
  ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
      auth: { persistSession:true, autoRefreshToken:true, detectSessionInUrl:true }
    })
  : null;

const AUTH = {
  loading:true,
  user:null,
  session:null,
  mode:"signin",
  message:"",
  messageType:"",
  busy:false,
};

function authSetMessage(message, type){
  AUTH.message = message || "";
  AUTH.messageType = type || "";
}

function authUserName(){
  const meta = AUTH.user && AUTH.user.user_metadata;
  return (meta && (meta.name || meta.full_name)) || (AUTH.user && AUTH.user.email ? AUTH.user.email.split("@")[0] : "You");
}

function authScreenHTML(){
  if(!SUPABASE_CONFIGURED){
    return `<div class="auth-wrap">
      <div class="auth-card">
        <div class="auth-brand">
          <span class="mark gradient-accent">${icon('shirt')}</span>
          <h1>Fit<span class="text-gradient">Pick</span></h1>
          <p>Your AI Stylist</p>
        </div>
        <div class="auth-msg error">
          Supabase authentication is not configured yet. Open this HTML file and replace
          <strong>YOUR_SUPABASE_URL</strong> and <strong>YOUR_SUPABASE_ANON_KEY</strong>
          with your project's public values.
        </div>
        <p class="auth-foot">Use only the public anon/publishable key. Never use the service role key in browser code.</p>
      </div>
    </div>`;
  }

  if(AUTH.mode === "forgot"){
    return `<div class="auth-wrap"><div class="auth-card">
      ${authBrandHTML()}
      <h2 style="font-size:18px;font-weight:800;margin-bottom:6px;">Reset password</h2>
      <p class="small muted" style="line-height:1.55;margin-bottom:18px;">Enter your email and we'll send a password reset link.</p>
      ${authMessageHTML()}
      <form onsubmit="event.preventDefault(); requestPasswordReset(this);">
        <div class="field"><label class="field-label">Email</label><input class="input" name="email" type="email" autocomplete="email" required placeholder="you@example.com"></div>
        <button class="btn btn-primary btn-block btn-lg" ${AUTH.busy?'disabled':''}>${AUTH.busy?'Sending…':'Send reset link'}</button>
      </form>
      <button class="auth-link" style="margin-top:16px;" onclick="setAuthMode('signin')">← Back to sign in</button>
    </div></div>`;
  }

  if(AUTH.mode === "update-password"){
    return `<div class="auth-wrap"><div class="auth-card">
      ${authBrandHTML()}
      <h2 style="font-size:18px;font-weight:800;margin-bottom:6px;">Choose a new password</h2>
      <p class="small muted" style="line-height:1.55;margin-bottom:18px;">Use at least 8 characters.</p>
      ${authMessageHTML()}
      <form onsubmit="event.preventDefault(); updateRecoveredPassword(this);">
        <div class="field"><label class="field-label">New password</label><input class="input" name="password" type="password" minlength="8" autocomplete="new-password" required></div>
        <div class="field"><label class="field-label">Confirm password</label><input class="input" name="confirmPassword" type="password" minlength="8" autocomplete="new-password" required></div>
        <button class="btn btn-primary btn-block btn-lg" ${AUTH.busy?'disabled':''}>${AUTH.busy?'Updating…':'Update password'}</button>
      </form>
    </div></div>`;
  }

  const signup = AUTH.mode === "signup";
  return `<div class="auth-wrap"><div class="auth-card">
    ${authBrandHTML()}
    <div class="auth-tabs">
      <button class="auth-tab ${!signup?'active':''}" onclick="setAuthMode('signin')">Sign In</button>
      <button class="auth-tab ${signup?'active':''}" onclick="setAuthMode('signup')">Create Account</button>
    </div>
    ${authMessageHTML()}
    <form onsubmit="event.preventDefault(); ${signup?'signUpWithEmail(this)':'signInWithEmail(this)'}">
      ${signup?`<div class="field"><label class="field-label">Name</label><input class="input" name="name" autocomplete="name" required placeholder="Your name"></div>`:''}
      <div class="field"><label class="field-label">Email</label><input class="input" name="email" type="email" autocomplete="email" required placeholder="you@example.com"></div>
      <div class="field"><label class="field-label">Password</label><input class="input" name="password" type="password" minlength="8" autocomplete="${signup?'new-password':'current-password'}" required placeholder="At least 8 characters"></div>
      ${signup?`<div class="field"><label class="field-label">Confirm password</label><input class="input" name="confirmPassword" type="password" minlength="8" autocomplete="new-password" required></div>`:''}
      ${!signup?`<div class="auth-row"><span></span><button type="button" class="auth-link" onclick="setAuthMode('forgot')">Forgot password?</button></div>`:''}
      <button class="btn btn-primary btn-block btn-lg" ${AUTH.busy?'disabled':''}>${AUTH.busy?(signup?'Creating account…':'Signing in…'):(signup?'Create Account':'Sign In')}</button>
    </form>
    <p class="auth-foot">Your FitPick session is handled securely by Supabase Auth. Your wardrobe on this single-file version remains stored locally on this device, separated by account.</p>
  </div></div>`;
}

function authBrandHTML(){
  return `<div class="auth-brand">
    <span class="mark gradient-accent">${icon('shirt')}</span>
    <h1>Fit<span class="text-gradient">Pick</span></h1>
    <p>Your wardrobe. Your style.</p>
  </div>`;
}

function authMessageHTML(){
  return AUTH.message ? `<div class="auth-msg ${AUTH.messageType==='success'?'success':'error'}">${esc(AUTH.message)}</div>` : "";
}

function setAuthMode(mode){
  AUTH.mode = mode;
  authSetMessage("");
  render();
}

async function signInWithEmail(form){
  if(!SB || AUTH.busy) return;
  AUTH.busy = true; authSetMessage(""); render();
  const email = form.email.value.trim();
  const password = form.password.value;
  const { error } = await SB.auth.signInWithPassword({ email, password });
  AUTH.busy = false;
  if(error){ authSetMessage("Could not sign in. Check your email and password.", "error"); render(); }
}

async function signUpWithEmail(form){
  if(!SB || AUTH.busy) return;
  const name = form.name.value.trim();
  const email = form.email.value.trim();
  const password = form.password.value;
  const confirmPassword = form.confirmPassword.value;
  if(password.length < 8){ authSetMessage("Password must be at least 8 characters.", "error"); render(); return; }
  if(password !== confirmPassword){ authSetMessage("Passwords do not match.", "error"); render(); return; }
  AUTH.busy = true; authSetMessage(""); render();
  const { data, error } = await SB.auth.signUp({ email, password, options:{ data:{ name } } });
  AUTH.busy = false;
  if(error){ authSetMessage(error.message || "Could not create your account.", "error"); render(); return; }
  if(data.session){
    authSetMessage("");
  }else{
    AUTH.mode = "signin";
    authSetMessage("Account created. Check your email to verify your account, then sign in.", "success");
    render();
  }
}

async function requestPasswordReset(form){
  if(!SB || AUTH.busy) return;
  AUTH.busy = true; authSetMessage(""); render();
  const email = form.email.value.trim();
  const redirectTo = location.href.split("#")[0];
  const { error } = await SB.auth.resetPasswordForEmail(email, { redirectTo });
  AUTH.busy = false;
  if(error) authSetMessage("Could not send the reset email. Please try again.", "error");
  else authSetMessage("If an account exists for that email, a password reset link has been sent.", "success");
  render();
}

async function updateRecoveredPassword(form){
  if(!SB || AUTH.busy) return;
  const password = form.password.value;
  const confirmPassword = form.confirmPassword.value;
  if(password.length < 8){ authSetMessage("Password must be at least 8 characters.", "error"); render(); return; }
  if(password !== confirmPassword){ authSetMessage("Passwords do not match.", "error"); render(); return; }
  AUTH.busy = true; authSetMessage(""); render();
  const { error } = await SB.auth.updateUser({ password });
  AUTH.busy = false;
  if(error){ authSetMessage("Could not update your password. Please request a new reset link.", "error"); render(); return; }
  AUTH.mode = "signin";
  authSetMessage("Password updated successfully.", "success");
  render();
}

async function signOutFitPick(){
  if(!SB) return;
  await SB.auth.signOut();
}

function authLoadingHTML(){
  return `<div class="auth-loading"><div style="text-align:center;">
    <div class="auth-spinner"></div>
    <p class="small muted">Loading your wardrobe…</p>
  </div></div>`;
}

function setDBKeyForUser(user){
  DB_KEY = user ? `fitpick_db_v1_${user.id}` : "fitpick_db_v1_guest";
}

function initializeUserDB(){
  setDBKeyForUser(AUTH.user);
  loadDB();
  if(DB && DB.profile){
    if(!DB.profile.name || DB.profile.name === "Alex" || DB.profile.name === "You") DB.profile.name = authUserName();
    DB.profile.email = AUTH.user ? AUTH.user.email : "";
    saveDB();
  }
  STATE.homeToday = null;
  STATE.homeSurprise = null;
  STATE.genResults = [];
  STATE.genAnchorId = null;
}

async function initAuth(){
  if(!SB){
    AUTH.loading = false;
    render();
    return;
  }
  const { data:{ session }, error } = await SB.auth.getSession();
  if(error) console.warn("Auth session check failed:", error.message);
  AUTH.session = session || null;
  AUTH.user = session && session.user ? session.user : null;
  if(AUTH.user) initializeUserDB();
  AUTH.loading = false;
  render();

  SB.auth.onAuthStateChange((event, sessionNow)=>{
    AUTH.session = sessionNow || null;
    AUTH.user = sessionNow && sessionNow.user ? sessionNow.user : null;
    AUTH.busy = false;
    if(event === "PASSWORD_RECOVERY"){
      AUTH.mode = "update-password";
      AUTH.loading = false;
      render();
      return;
    }
    if(AUTH.user){
      initializeUserDB();
      AUTH.mode = "signin";
      authSetMessage("");
      if(!location.hash || location.hash.startsWith("#/auth")) location.hash = "#/home";
    }else{
      DB = null;
      setDBKeyForUser(null);
      AUTH.mode = "signin";
      authSetMessage("");
      if(location.hash && !location.hash.startsWith("#/auth")) location.hash = "#/auth";
    }
    AUTH.loading = false;
    render();
  });
}

function esc(s){ return String(s??'').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function cap(s){ return s && s.length ? s[0].toUpperCase()+s.slice(1) : s; }
function uid(){ return 'id-' + Math.random().toString(36).slice(2,10) + Date.now().toString(36); }
function clamp(n,min,max){ return Math.min(max, Math.max(min,n)); }
function round(n){ return Math.round(n*10)/10; }
function hashString(input){ let h=2166136261; for(let i=0;i<input.length;i++){ h ^= input.charCodeAt(i); h = Math.imul(h, 16777619);} return h>>>0; }
function mulberry32(seed){ let a = seed>>>0; return function(){ a|=0; a=(a+0x6d2b79f5)|0; let t=Math.imul(a ^ (a>>>15), 1|a); t=(t+Math.imul(t ^ (t>>>7), 61|t)) ^ t; return ((t ^ (t>>>14))>>>0)/4294967296; }; }
function seededRng(seedText){ return mulberry32(hashString(seedText)); }
function pickSeeded(rng, arr){ return arr[Math.floor(rng()*arr.length)]; }
function dateISO(d){ const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), day=String(d.getDate()).padStart(2,'0'); return `${y}-${m}-${day}`; }
function dayLabel(iso){ const today=dateISO(new Date()); const yest=dateISO(new Date(Date.now()-864e5)); if(iso===today) return 'Today'; if(iso===yest) return 'Yesterday'; const d=new Date(iso+'T12:00:00'); return d.toLocaleDateString(undefined,{weekday:'short',month:'long',day:'numeric'}); }
function timeAgo(iso){ if(!iso) return 'Never'; const then=new Date(iso).getTime(); const diff=Date.now()-then; const days=Math.floor(diff/864e5); if(days<=0) return 'Today'; if(days===1) return 'Yesterday'; if(days<30) return `${days} days ago`; const months=Math.floor(days/30); return months===1?'1 month ago':`${months} months ago`; }
function greetingFor(date=new Date()){ const h=date.getHours(); if(h<5) return 'Up late'; if(h<12) return 'Good morning'; if(h<17) return 'Good afternoon'; return 'Good evening'; }
function matchLabel(score){ if(score>=88) return 'Excellent Match'; if(score>=76) return 'Great Match'; if(score>=64) return 'Good Match'; return 'Experimental'; }

function hexToHsl(hex){ const clean=hex.replace('#',''); const r=parseInt(clean.slice(0,2),16)/255, g=parseInt(clean.slice(2,4),16)/255, b=parseInt(clean.slice(4,6),16)/255; const max=Math.max(r,g,b), min=Math.min(r,g,b); const l=(max+min)/2; const d=max-min; if(d===0) return {h:0,s:0,l}; const s=l>0.5? d/(2-max-min) : d/(max+min); let h; if(max===r) h=((g-b)/d+(g<b?6:0))*60; else if(max===g) h=((b-r)/d+2)*60; else h=((r-g)/d+4)*60; return {h,s,l}; }

const EARTH_TONES = new Set(['brown','tan','beige','olive','cream','burgundy']);

function describePalette(type, unique, chromatic){
  const lead = unique.slice(0,2).join(' and ');

    case 'neutral': return `${lead} form a clean neutral palette`;
    case 'accented-neutral': return `${chromatic[0]} stands out against neutral tones`;
    case 'earthy': return `${lead} create a warm, earthy palette`;
    case 'monochrome': return `tonal ${lead} shades stay in one family`;
    case 'analogous': return `${lead} sit close together on the color wheel`;

function analyzePalette(ordered){

  if(!colors.length) return { score:70, type:'mixed', roles:[], neutralCount:0, accentCount:0, description:'' };
  const roles = colors.map((color,i)=>({color, role: i===0?'base': i===1?'support':'accent'}));
  const neutrals = colors.filter(isNeutral);

  const uniqueChromatic = [...new Set(chromatics)];
  const hues = uniqueChromatic.map(c=>hexToHsl(colorHex(c)).h);

  for(let i=0;i<colors.length;i++) for(let j=i+1;j<colors.length;j++){ pairSum+=pairColorScore(colors[i],colors[j]); pairCount++; }
  const pairAvg = pairCount? pairSum/pairCount : 80;
  let type='mixed', archetypeScore=74;
  const uniqueAll=[...new Set(colors)];
  if(uniqueChromatic.length===0){ type='neutral'; archetypeScore = uniqueAll.length===1?90:95; }
  else if(uniqueChromatic.length===1){ const allEarthy = uniqueAll.every(c=>EARTH_TONES.has(c)||isNeutral(c)); type = allEarthy?'earthy':'accented-neutral'; archetypeScore=94; }
  else {
    const gaps=[]; for(let i=0;i<hues.length;i++) for(let k=i+1;k<hues.length;k++) gaps.push(hueDistance(hues[i],hues[k]));
    const maxHueGap = gaps.length? Math.max(...gaps) : 0;
    if(maxHueGap<=30){ type='monochrome'; archetypeScore=90; }
    else if(maxHueGap<=60){ type='analogous'; archetypeScore=88; }
    else if(maxHueGap>=145 && uniqueChromatic.length===2){

}

/* ---------------------------------------------------------------------- *
 * "Why this outfit?" — plain-language explanations
 * ---------------------------------------------------------------------- */
const OCCASION_PHRASE = { casual:'an easy day out', office:'a day at work', date:'a date', dinner:'dinner', party:'a party', wedding:'a wedding', formal:'a formal event', travel:'travel days', gym:'the gym' };
const WEATHER_PHRASE = { hot:'hot weather', warm:'warm weather', cool:'cooler weather', cold:'cold weather' };

function explainOutfit(ctx){
  const { items, palette, breakdown, occasion, formality, weather } = ctx;
  const shoes=itemOf(items,'footwear'), outer=itemOf(items,'outerwear'), accessory=itemOf(items,'accessory');
  const first = palette.description ? cap(palette.description)+'.' : 'These pieces sit comfortably together.';
  const tone = TONE_BY_FORMALITY[formality] || 'balanced';
  const where = OCCASION_PHRASE[occasion] || 'the day ahead';
  const anchor = shoes ? `The ${shoes.name.toLowerCase()} keep${shoes.name.endsWith('s')?'':'s'} it ${tone}` : `The overall feel is ${tone}`;
  const second = `${anchor}, which suits ${where}.`;
  let third='';
  if(outer) third = ` The ${outer.name.toLowerCase()} adds a layer${weather?` for ${WEATHER_PHRASE[weather]||'the forecast'}`:''}.`;
  else if(accessory) third = ` The ${accessory.name.toLowerCase()} finishes it off.`;
  else if(weather) third = ` It should feel right in ${WEATHER_PHRASE[weather]||'today\u2019s weather'}.`;
  const explanation = `${first} ${second}${third}`.trim();
  const reasons=[];
  reasons.push(`Colors: ${palette.description || 'balanced tones'}`);
  reasons.push(`Dressed for: ${cap(occasion)} \u00b7 ${formalityLabel(formality)}`);
  if(breakdown.style>=80) reasons.push('The pieces share a consistent style');
  else if(breakdown.style<62) reasons.push('A slightly unexpected style mix');
  if(weather) reasons.push(`Picked for ${WEATHER_PHRASE[weather]||weather}`);
  if(breakdown.formality>=88) reasons.push('Formality is consistent head to toe');
  else if(breakdown.formality<65) reasons.push('Mixes dressier and casual pieces');
  if(ctx.favoriteNames.length) reasons.push(`Includes a favorite: ${ctx.favoriteNames.slice(0,2).join(', ')}`);
  return { explanation, reasons };
}

/* ---------------------------------------------------------------------- *
 * Outfit combination engine — never random: every candidate is scored on
 * a weighted composite (color 25% / occasion 20% / style 20% / formality

 * ---------------------------------------------------------------------- */
const CATEGORY_TO_SLOT = { tops:'top', bottoms:'bottom', outerwear:'outerwear', footwear:'footwear', accessories:'accessory' };
const SLOT_ORDER = ['top','bottom','footwear','outerwear','accessory'];

const DISPLAY_THRESHOLD = 55, SOFT_FLOOR = 46;
function hasTag(list, value){ const v=(value||'').toLowerCase(); return (list||[]).some(x=>(x||'').toLowerCase()===v); }

function avg(nums){ return nums.length? nums.reduce((a,b)=>a+b,0)/nums.length : 0; }

function styleCohesionOf(c, selected, profileStyle){
  const items=piecesOf(c); const norm=i=>(i.styles||[]).map(s=>s.toLowerCase());
  let pairSum=0, pairCount=0;
  for(let a=0;a<items.length;a++) for(let b=a+1;b<items.length;b++){
    const A=norm(items[a]), B=norm(items[b]);
    const overlap=A.some(s=>B.includes(s));
    const lenient = items[a].category==='footwear'||items[b].category==='footwear'||items[a].category==='accessories'||items[b].category==='accessories';
    pairSum += overlap?100:(lenient?74:56); pairCount++;
  }
  const cohesion = pairCount? pairSum/pairCount : 66;
  const wanted=(selected||profileStyle||'').toLowerCase();
  if(!wanted) return cohesion;
  const fit = avg(items.map(i=>{ if(norm(i).includes(wanted)) return 100; if(i.category==='footwear'||i.category==='accessories') return 76; return 58; }));

function formalityScoreOf(c, occasion, shift){
  const core=[c.top,c.bottom,c.footwear,c.outerwear].filter(Boolean);
  const levels=core.map(i=>i.formalityLevel||3);
  const spread=Math.max(...levels)-Math.min(...levels);
  const spreadScore = spread===0?100: spread===1?92: spread===2?70: spread===3?40:15;
  const level=Math.round(avg(levels)*10)/10;

  if(occasion){ const target=clamp((OCCASION_FORMALITY[occasion]??3)+shift,1,6); const diff=Math.abs(level-target); targetScore=clamp(100-diff*22,10,100); }

function weatherScoreOf(c, weather){ if(!weather) return 82; const wanted=WEATHER_TO_SEASONS[weather]||[]; return avg(piecesOf(c).map(i=>{ const seasons=i.seasons||[]; if(!seasons.length) return 72; return seasons.some(s=>wanted.includes(s))?100:40; })); }

  let score=78;

  const avoid=(prefs.avoidColors||[]).map(x=>x.toLowerCase());
  const favStyles=(prefs.favoriteStyles||[]).map(x=>x.toLowerCase());

    const color=(item.primaryColor||'').toLowerCase();
    if(item.isFavorite) score+=7;
    if(favColors.includes(color)) score+=5;
    if(avoid.includes(color)) score-=34;
    if(item.status==='worn') score-=3;

function recencyPenaltyOf(c, recent){

function toSlots(c){ const slots=[{slot:'top',item:c.top},{slot:'bottom',item:c.bottom},{slot:'footwear',item:c.footwear}]; if(c.outerwear) slots.push({slot:'outerwear',item:c.outerwear}); if(c.accessory) slots.push({slot:'accessory',item:c.accessory}); return slots.sort((a,b)=>SLOT_ORDER.indexOf(a.slot)-SLOT_ORDER.indexOf(b.slot)); }

function generateOutfits(input){
  const criteria = input.criteria || {};
  const maxOptions = input.maxOptions || 3;
  const avail = availableItems(input.items);
  const rng = seededRng(criteria.seed || ('seed:'+Date.now()+':'+Math.random()));
  const look = lookById(criteria.look);
  const style = criteria.style || (look? look.styles[0] : '') || '';
  const formalityShift = look? look.formalityShift : 0;
  const pools = {
    top: avail.filter(i=>i.category==='tops'),
    bottom: avail.filter(i=>i.category==='bottoms'),
    footwear: avail.filter(i=>i.category==='footwear'),
    outerwear: avail.filter(i=>i.category==='outerwear'),
    accessory: avail.filter(i=>i.category==='accessories'),
  };
  const anchor = criteria.startingItemId ? avail.find(i=>i.id===criteria.startingItemId) : undefined;
  if(anchor){ const slot=CATEGORY_TO_SLOT[anchor.category]; if(slot) pools[slot]=[anchor]; }
  const missing = missingCoreCategories(input.items);
  if(missing.length) return { outfits:[], missingCategories:missing, availableCount:avail.length };

  const tops = samplePool(rng, pools.top, 24);
  const bottoms = samplePool(rng, pools.bottom, 24);
  const footwear = samplePool(rng, pools.footwear, 24);
  const weather = criteria.weather || null;
  const occasion = criteria.occasion;

  const scored = []; const seen = new Set();
  for(const top of tops){
    for(const bottom of bottoms){
      const tb = pairColorScore(top.primaryColor, bottom.primaryColor);
      if(tb<38 && rng()>0.12) continue;
      if(Math.abs((top.formalityLevel||3)-(bottom.formalityLevel||3))>=4) continue;
      for(const shoe of footwear){
        const cand = { top, bottom, footwear:shoe };
        const wantOuter = pools.outerwear.length>0 && (
          (anchor && anchor.category==='outerwear') ||
          (weather==='cold' ? true : weather==='cool' ? rng()<0.55 : weather==='hot' ? false : rng()<0.32)
        );
        if(wantOuter){
          let best, bestScore=-1;
          for(const o of samplePool(rng, pools.outerwear, 6)){
            const s = pairColorScore(o.primaryColor, top.primaryColor)*0.35 + pairColorScore(o.primaryColor, bottom.primaryColor)*0.35 + (occasion && hasTag(o.occasions, occasion)?20:0) - Math.abs((o.formalityLevel||3)-(top.formalityLevel||3))*6 + rng()*6;
            if(s>bestScore){ bestScore=s; best=o; }
          }
          if(best) cand.outerwear = best;
        }
        if(pools.accessory.length>0 && occasion!=='gym' && rng()<0.5){
          let best, bestScore=-1;
          for(const a of samplePool(rng, pools.accessory, 6)){
            const s = (occasion && hasTag(a.occasions, occasion)?60:30) + pairColorScore(a.primaryColor, top.primaryColor)*0.3 + rng()*8;
            if(s>bestScore){ bestScore=s; best=a; }
          }
          if(best) cand.accessory = best;
        }
        const key = setKey(cand);
        if(seen.has(key)) continue;
        seen.add(key);
        const palette = paletteOf(cand);
        const formality = formalityScoreOf(cand, occasion, formalityShift);
        const breakdown = {
          color: round(colorScoreOf(cand, palette)),
          occasion: round(occasionScoreOf(cand, occasion)),
          style: round(styleCohesionOf(cand, style, input.preferences.profileStyle)),
          formality: round(formality.score),
          weather: round(weatherScoreOf(cand, weather)),
          preference: round(preferenceScoreOf(cand, input.preferences)),
        };
        const total = round(
          WEIGHTS.color*breakdown.color + WEIGHTS.occasion*breakdown.occasion + WEIGHTS.style*breakdown.style +
          WEIGHTS.formality*breakdown.formality + WEIGHTS.weather*breakdown.weather + WEIGHTS.preference*breakdown.preference -
          recencyPenaltyOf(cand, input.recent)
        );
        scored.push({ cand, breakdown, palette, formality: formality.level, total });
      }
    }
  }
  scored.sort((a,b)=>b.total-a.total);
  const anchorId = anchor? anchor.id : undefined;
  const accepted = [];
  const distinctEnough = (a,b,min)=>{ const idsA=new Set(piecesOf(a.cand).map(i=>i.id)); if(anchorId) idsA.delete(anchorId); return piecesOf(b.cand).filter(i=>i.id!==anchorId && !idsA.has(i.id)).length >= min; };
  for(const s of scored){ if(accepted.length>=maxOptions) break; if(s.total<DISPLAY_THRESHOLD) continue; if(accepted.every(a=>distinctEnough(a,s,2))) accepted.push(s); }

    for(const s of scored){ if(accepted.length>=Math.min(2,maxOptions)) break; if(s.total<SOFT_FLOOR) continue; if(!accepted.includes(s) && accepted.every(a=>distinctEnough(a,s,1))) accepted.push(s); }
  }
  const resolvedStyle = (style || input.preferences.profileStyle || dominantStyle(avail) || 'smart casual').toLowerCase();
  const outfits = accepted.map(s=>{
    const items = toSlots(s.cand);
    const { explanation, reasons } = explainOutfit({
      items, palette:s.palette, breakdown:s.breakdown, occasion: occasion || 'casual', formality: Math.round(s.formality), weather,
      favoriteNames: items.filter(x=>x.item.isFavorite).map(x=>x.item.name),
    });
    return { items, score:s.total, breakdown:s.breakdown, label: matchLabel(s.total), explanation, reasons, paletteType:s.palette.type, formality:Math.round(s.formality), occasion: occasion||'casual', style: resolvedStyle, weather };
  });
  return { outfits, missingCategories: [], availableCount: avail.length };
}

/* ---------------------------------------------------------------------- *
 * Wardrobe insights — a few human sentences, not a dashboard
 * ---------------------------------------------------------------------- */
const NEGLECT_DAYS = 60;

function buildInsights(items){
  const out=[]; if(items.length<3) return out;
  const worn=[...items].sort((a,b)=>b.timesWorn-a.timesWorn);
  const most=worn[0];
  if(most && most.timesWorn>0) out.push({ id:'most-worn', icon:'star', text:`Your ${most.name.toLowerCase()} is your most worn item \u2014 ${most.timesWorn} wear${most.timesWorn===1?'':'s'}.`, itemId:most.id, imageUrl:most.imageUrl });
  const neglected = items.map(i=>({item:i, days:daysSince(i.lastWorn)})).filter(x=>x.days===null || x.days>=NEGLECT_DAYS).sort((a,b)=>(b.days??9999)-(a.days??9999));
  if(neglected.length){
    const {item,days}=neglected[0];
    out.push({ id:'neglected', icon:'clock', text: days===null? `You haven't worn your ${item.name.toLowerCase()} yet \u2014 give it a try.` : `You haven't worn your ${item.name.toLowerCase()} in ${days} days.`, itemId:item.id, imageUrl:item.imageUrl });
    if(neglected.length>1) out.push({ id:'neglected-count', icon:'shirt', text:`${neglected.length} pieces haven't been worn in a while \u2014 they could freshen up your rotation.` });
  }
  const colorCounts=new Map(), styleCounts=new Map();
  for(const i of items){ colorCounts.set(i.primaryColor,(colorCounts.get(i.primaryColor)||0)+1); for(const s of (i.styles||[])) styleCounts.set(s,(styleCounts.get(s)||0)+1); }
  const topColor=topOf(colorCounts);
  if(topColor && topColor[1]>=2) out.push({ id:'top-color', icon:'palette', text:`${cap(topColor[0])} is your signature color \u2014 ${topColor[1]} pieces in your closet.` });
  const topStyle=topOf(styleCounts);
  if(topStyle && topStyle[1]>=2) out.push({ id:'top-style', icon:'sparkles', text:`You lean ${topStyle[0]} \u2014 it shows up in ${topStyle[1]} of your pieces.` });
  const leastWorn=worn[worn.length-1];
  if(leastWorn && most && leastWorn.id!==most.id && leastWorn.timesWorn===0) out.push({ id:'least-worn', icon:'clock', text:`Your ${leastWorn.name.toLowerCase()} is still waiting for its first outing.`, itemId:leastWorn.id, imageUrl:leastWorn.imageUrl });
  return out.slice(0,5);
}

const FIT_BY_SUB = {
  't-shirt':['regular','relaxed'], shirt:['regular','slim'], blouse:['regular'], polo:['regular','slim'], hoodie:['relaxed','oversized'],
  sweatshirt:['relaxed','oversized'], sweater:['regular','relaxed'], jeans:['slim','regular'], chinos:['slim','regular'],
  trousers:['regular','slim'], joggers:['relaxed'], shorts:['regular'], blazer:['slim','regular'], coat:['regular','oversized'], jacket:['regular'],
};
const DARK_COLOR_IDS = new Set(['black','charcoal','navy','burgundy','brown','purple']);
const WARM_COLOR_IDS = new Set(COLORS.filter(c=>['warm','earth'].includes(c.family)).map(c=>c.id));
function seasonsFor(color, category, rng){
  if(category==='outerwear') return ['fall','winter','spring'];
  if(DARK_COLOR_IDS.has(color)) return ['fall','winter','spring'];
  const light = !WARM_COLOR_IDS.has(color);
  if(light && rng()<0.6) return ['spring','summer','fall'];
  return rng()<0.5 ? ['spring','summer'] : SEASON_IDS.slice(0,3);
}
function pick(rng, arr){ return arr[Math.floor(rng()*arr.length)]; }
/** Deterministic heuristic analysis — mirrors the product's mock AI provider. */
function analyzeClothingItem({ category, subcategory, dominantColor, seedKey }){
  const rng = seededRng(String(seedKey||'')+'|'+category+'|'+subcategory+'|'+(dominantColor||''));
  const primaryColor = (dominantColor || 'grey').toLowerCase();
  const stylePool = CATEGORY_STYLES[category] || STYLE_IDS;
  const styles = [...new Set([pick(rng,stylePool), pick(rng,stylePool)])];
  const occasions = (OCCASION_BY_SUB[subcategory] || ['casual','dinner','travel']).slice(0,4);
  const seasons = seasonsFor(primaryColor, category, rng);
  const formalityLevel = defaultFormality(subcategory, category);
  const materialPool = MATERIAL_BY_SUB[subcategory];
  const material = materialPool ? pick(rng, materialPool) : null;
  const fitPool = FIT_BY_SUB[subcategory];
  const fit = category!=='accessories' && fitPool ? pick(rng, fitPool) : null;
  const patternPool = ['solid','solid','solid', ...PATTERN_IDS.filter(p=>p!=='solid')];
  const pattern = pick(rng, patternPool);
  const secondaryColor = pattern!=='solid' && rng()<0.5 ? pick(rng, ['white','cream','grey','black']) : null;
  const name = `${cap(primaryColor)} ${material && rng()<0.4 ? cap(material)+' ' : ''}${cap(subcategory)}`;
  return { name, primaryColor, secondaryColor, pattern, material, fit, formalityLevel, styles, seasons, occasions };
}

/* ---------------------------------------------------------------------- *
 * Client-side image pipeline — downscale + recompress, sample dominant
 * color (feeds the analyzer). Pure browser canvas APIs.
 * ---------------------------------------------------------------------- */
const MAX_DIM = 640, JPEG_QUALITY = 0.78;
function loadImage(src){ return new Promise((resolve,reject)=>{ const img=new Image(); img.onload=()=>resolve(img); img.onerror=()=>reject(new Error('Could not read that image')); img.src=src; }); }
async function processClothingImage(fileOrBlob){
  const objectUrl = URL.createObjectURL(fileOrBlob);
  try{
    const img = await loadImage(objectUrl);
    const scale = Math.min(1, MAX_DIM/Math.max(img.width,img.height));
    const width = Math.max(1, Math.round(img.width*scale)), height = Math.max(1, Math.round(img.height*scale));
    const canvas = document.createElement('canvas'); canvas.width=width; canvas.height=height;
    const ctx = canvas.getContext('2d'); ctx.drawImage(img,0,0,width,height);
    const sample = document.createElement('canvas'); sample.width=14; sample.height=14;
    const sctx = sample.getContext('2d'); let dominantColor='grey';
    sctx.drawImage(canvas,0,0,14,14);
    const { data } = sctx.getImageData(0,0,14,14);
    let r=0,g=0,b=0,n=0;
    for(let i=0;i<data.length;i+=4){ if(data[i+3]<40) continue; r+=data[i]; g+=data[i+1]; b+=data[i+2]; n++; }
    if(n>0) dominantColor = nearestColor(r/n,g/n,b/n);
    const dataUrl = canvas.toDataURL('image/jpeg', JPEG_QUALITY);
    return { dataUrl, width, height, dominantColor };
  } finally { URL.revokeObjectURL(objectUrl); }
}

/* =========================================================================
   Persistence — everything lives in localStorage. One JSON blob, versioned.
   ========================================================================= */
let DB_KEY = 'fitpick_db_v1_guest';
function freshDB(){
  return {
    items: [], outfits: [], wear: [],
    profile: { name:(typeof AUTH!=='undefined' && AUTH.user ? authUserName() : 'You'), email:(typeof AUTH!=='undefined' && AUTH.user ? AUTH.user.email : ''), preferredStyle:'', preferences:{ favoriteColors:[], favoriteStyles:[], avoidColors:[], preferredFit:'' }, theme:'dark' },
  };
}
let DB = null;
function loadDB(){
  try{ const raw = localStorage.getItem(DB_KEY); DB = raw ? JSON.parse(raw) : freshDB(); }
  catch(e){ DB = freshDB(); }
  if(!DB.profile) DB.profile = freshDB().profile;
  if(!DB.profile.preferences) DB.profile.preferences = freshDB().profile.preferences;
  return DB;
}
function saveDB(){
  try{ localStorage.setItem(DB_KEY, JSON.stringify(DB)); }
  catch(e){ toast('Storage is full \u2014 try removing an item or a photo.'); }
}

function getItem(id){ return DB.items.find(i=>i.id===id); }
function getOutfit(id){ return DB.outfits.find(o=>o.id===id); }
function outfitItemsResolved(outfit){ return outfit.items.map(s=>({ slot:s.slot, item:getItem(s.itemId) })).filter(s=>s.item); }
function closetSummary(){
  const byCategory={}; for(const c of CATEGORY_IDS) byCategory[c]=0;
  for(const i of DB.items) byCategory[i.category]=(byCategory[i.category]||0)+1;
  return { total: DB.items.length, byCategory };
}
function recentCombos(){
  const cutoff = 14;
  return DB.wear.filter(w=>{ const d=daysSince(w.wornDate+'T12:00:00'); return d!==null && d<=cutoff; })
    .map(w=>{ const o=getOutfit(w.outfitId); if(!o) return null; return { itemIds:o.items.map(s=>s.itemId), daysAgo: daysSince(w.wornDate+'T12:00:00') ?? 0 }; })
    .filter(Boolean);
}
function enginePrefs(){
  const p = DB.profile.preferences;
  return { favoriteColors:p.favoriteColors||[], favoriteStyles:p.favoriteStyles||[], avoidColors:p.avoidColors||[], preferredFit:p.preferredFit||'', profileStyle: DB.profile.preferredStyle||'' };
}

function addWearForOutfitItems(outfitItemSlots){
  const wornDate = dateISO(new Date());
  for(const {item} of outfitItemSlots){
    const it = getItem(item.id);
    if(!it) continue;
    it.timesWorn = (it.timesWorn||0)+1;
    it.lastWorn = new Date().toISOString();
    if(it.status==='clean') it.status='worn';
  }
}

function wearOutfit(outfitId, opts){
  opts = opts || {};
  const outfit = getOutfit(outfitId);
  if(!outfit) return;
  const entry = { id: uid(), wornDate: dateISO(new Date()), occasion: opts.occasion || outfit.occasion || 'casual', rating: opts.rating ?? null, notes: opts.notes ?? null, outfitId };
  DB.wear.unshift(entry);
  outfit.lastWorn = new Date().toISOString();
  addWearForOutfitItems(outfitItemsResolved(outfit));
  saveDB();
}

/** Persist a freshly-generated outfit (from the engine) as a saved OutfitDTO. */
function saveGeneratedOutfit(gen, name){
  const outfit = {
    id: uid(),
    name: name || `${cap(gen.style||'')} ${cap(gen.occasion||'')}`.trim() || 'Untitled Look',
    occasion: gen.occasion || 'casual', style: gen.style || '', weather: gen.weather || null,
    compatibilityScore: gen.score, isFavorite: false, createdAt: new Date().toISOString(),
    items: gen.items.map(s=>({ slot:s.slot, itemId:s.item.id })), lastWorn: null,
  };
  DB.outfits.unshift(outfit);
  saveDB();
  return outfit;
}

  return `<span class="badge ${map[status]||'badge-neutral'}">${s?s.label:status}</span>`;
}

function computeHomeToday(){
  const missing = missingCoreCategories(DB.items);
  STATE.homeMissing = missing;
  if(missing.length || !DB.items.length){ STATE.homeToday = null; return; }
  const criteria = { occasion: STATE.homeOccasion||undefined, look: STATE.homeLook||undefined, seed: 'home:'+(STATE.homeOccasion||'')+':'+(STATE.homeLook||'')+':'+(STATE.homeNonce||0) };
  const res = generateOutfits({ items: DB.items, criteria, preferences: enginePrefs(), recent: recentCombos(), maxOptions:1 });
  STATE.homeToday = res.outfits[0] || null;
  STATE.homeMissing = res.missingCategories;
}
function dressMe(bumpNonce){
  if(bumpNonce) STATE.homeNonce = (STATE.homeNonce||0)+1;
  computeHomeToday();
  render();
}
function selectHomeOccasion(id){ STATE.homeOccasion = STATE.homeOccasion===id? null : id; computeHomeToday(); render(); }
function selectHomeLook(id){ STATE.homeLook = STATE.homeLook===id? null : id; computeHomeToday(); render(); }
function surpriseMeHome(){
  const res = generateOutfits({ items: DB.items, criteria:{ seed:'surprise:'+Date.now() }, preferences: enginePrefs(), recent: recentCombos(), maxOptions:1 });
  if(res.outfits.length){ STATE.homeSurprise = res.outfits[0]; toast('Here\u2019s a surprise look'); }
  else if(res.missingCategories.length) toast(`Add ${res.missingCategories.map(cap).join(', ')} to unlock outfits`);
  else toast('Nothing clean available \u2014 check the laundry');
  render();
}
function wearHomeToday(){
  if(!STATE.homeToday) return;
  const saved = saveGeneratedOutfit(STATE.homeToday, `${cap(STATE.homeToday.style||'')} Look`.trim());
  wearOutfit(saved.id, { occasion: STATE.homeToday.occasion });
  toast('Marked as worn today');
  STATE.homeToday=null; STATE.homeSurprise=null;
  computeHomeToday();
  render();
}
function saveHomeToday(){
  if(!STATE.homeToday) return;
  saveGeneratedOutfit(STATE.homeToday, `${cap(STATE.homeToday.style||'')} Look`.trim());
  toast('Saved to your outfits');
}
function wearHomeSurprise(){
  if(!STATE.homeSurprise) return;
  const saved = saveGeneratedOutfit(STATE.homeSurprise, 'Surprise Look');
  wearOutfit(saved.id, { occasion: STATE.homeSurprise.occasion });
  toast('Marked as worn today');
  STATE.homeSurprise=null;
  render();
}
function saveHomeSurprise(){
  if(!STATE.homeSurprise) return;
  saveGeneratedOutfit(STATE.homeSurprise, 'Surprise Look');

}

function setClosetCategory(cat){ STATE.closetCategory=cat; render(); }
function setClosetQuery(v){ STATE.closetQuery=v; renderClosetGridOnly(); }
function setClosetSort(v){ STATE.closetSort=v; render(); }
function renderClosetGridOnly(){
  const host = document.getElementById('closet-grid');
  if(host) host.outerHTML = closetGridHTML();
}
function filteredClosetItems(){
  let items = DB.items.slice();
  if(STATE.closetCategory!=='all') items = items.filter(i=>i.category===STATE.closetCategory);
  const q = STATE.closetQuery.trim().toLowerCase();
  if(q) items = items.filter(i => (i.name+' '+i.brand+' '+i.subcategory+' '+i.primaryColor).toLowerCase().includes(q));
  if(STATE.closetSort==='recent') items.sort((a,b)=> new Date(b.createdAt)-new Date(a.createdAt));
  else if(STATE.closetSort==='most-worn') items.sort((a,b)=> (b.timesWorn||0)-(a.timesWorn||0));
  else if(STATE.closetSort==='least-worn') items.sort((a,b)=> (a.timesWorn||0)-(b.timesWorn||0));
  else if(STATE.closetSort==='name') items.sort((a,b)=> a.name.localeCompare(b.name));
  return items;
}
function itemTileHTML(item){
  return `

function deleteItemConfirm(id){ confirmAction('Remove this item?', 'It will be removed from your closet and any saved outfits.', 'Remove', `deleteItemNow('${id}')`); }
function deleteItemNow(id){
  DB.items = DB.items.filter(i=>i.id!==id);
  DB.outfits.forEach(o=>{ o.items = o.items.filter(s=>s.itemId!==id); });
  DB.outfits = DB.outfits.filter(o=>o.items.length>0);

      <span style="${selected.includes(v)?'':''}">${labelFn(v)}</span>
    </label>`).join('');
}
function multiChipGroupWired(name, options, selected){
  // renders with initial 'selected' class applied server-side (string build)

      <input type="checkbox" data-${name} value="${v}" ${selected.includes(v)?'checked':''} style="display:none;" onchange="this.parentElement.classList.toggle('selected', this.checked)">

function pickSwatch(el){

/* =========================================================================

   ========================================================================= */
function resetAddFlow(){ STATE.addPhoto=null; STATE.addStep='photo'; STATE.addCategory=null; STATE.addSubcategory=null; STATE.addAnalysis=null; }
function initAddScreen(){ if(!STATE.addStep) resetAddFlow(); }

async function handleAddFile(input){
  const file = input.files && input.files[0];
  if(!file) return;
  toast('Processing photo\u2026');
  try{
    const processed = await processClothingImage(file);
    STATE.addPhoto = processed;
    STATE.addStep = 'category';
    render();
  }catch(e){ toast('Could not read that photo'); }
}
function useNoPhoto(){
  STATE.addPhoto = { dataUrl:null, dominantColor:'grey' };
  STATE.addStep = 'category';
  render();
}
function chooseAddCategory(cat){ STATE.addCategory=cat; STATE.addSubcategory=null; render(); }
function chooseAddSubcategory(sub){
  STATE.addSubcategory = sub;
  const analysis = analyzeClothingItem({ category:STATE.addCategory, subcategory:sub, dominantColor: STATE.addPhoto.dominantColor, seedKey: uid() });
  STATE.addAnalysis = analysis;
  STATE.addStep = 'review';
  render();
}
function backToPhotoStep(){ STATE.addStep='photo'; render(); }
function backToCategoryStep(){ STATE.addStep='category'; render(); }

function saveNewItem(){
  const f = document.getElementById('add-review-form');
  const category = STATE.addCategory, subcategory = STATE.addSubcategory;
  const name = f.name.value.trim() || `${cap(f.primaryColor.value)} ${cap(subcategory)}`;
  const item = {
    id: uid(), name, imageUrl: STATE.addPhoto.dataUrl || placeholderImage(category, f.primaryColor.value, f.secondaryColor.value||null),
    category, subcategory,
    primaryColor: f.primaryColor.value, secondaryColor: f.secondaryColor.value || null,
    pattern: f.pattern.value, material: f.material.value || null, fit: f.fit.value || null,
    formalityLevel: Number(f.formalityLevel.value),
    styles: Array.from(f.querySelectorAll('[data-styles]:checked')).map(x=>x.value),
    seasons: Array.from(f.querySelectorAll('[data-seasons]:checked')).map(x=>x.value),
    occasions: Array.from(f.querySelectorAll('[data-occasions]:checked')).map(x=>x.value),
    brand: f.brand.value.trim() || null, status:'clean', notes: f.notes.value.trim() || null,
    timesWorn:0, lastWorn:null, isFavorite:false, createdAt: new Date().toISOString(),

  DB.items.push(item);
  saveDB();
  toast('Added to your closet');

function openAnchorPicker(){
  const avail = availableItems(DB.items);
  openSheet(`

function runGenerate(){
  const missing = missingCoreCategories(DB.items);
  if(missing.length){ STATE.genMissing=missing; STATE.genResults=[]; render(); return; }
  const criteria = { occasion: STATE.genOccasion||undefined, style: STATE.genStyle||undefined, weather: STATE.genWeather||undefined, startingItemId: STATE.genAnchorId||undefined, seed:'gen:'+Date.now() };
  const res = generateOutfits({ items: DB.items, criteria, preferences: enginePrefs(), recent: recentCombos(), maxOptions:3 });
  STATE.genResults = res.outfits;
  STATE.genMissing = res.missingCategories;
  STATE.genExpanded = {};
  if(!res.outfits.length && !res.missingCategories.length) toast('Nothing clean is available right now');
  render();
  setTimeout(()=>{ const el=document.getElementById('gen-results'); if(el) el.scrollIntoView({behavior:'smooth', block:'start'}); }, 60);
}
function saveGenResult(idx){ const g=STATE.genResults[idx]; if(!g) return; saveGeneratedOutfit(g, `${cap(g.style||'')} ${cap(g.occasion||'')}`.trim()); toast('Saved to your outfits'); }
function wearGenResult(idx){ const g=STATE.genResults[idx]; if(!g) return; const saved=saveGeneratedOutfit(g, `${cap(g.style||'')} ${cap(g.occasion||'')}`.trim()); wearOutfit(saved.id,{occasion:g.occasion}); toast('Marked as worn today'); STATE.genResults=[]; render(); }

  <div class="card mt-4">
    <div class="section-title"><h2>Favorite colors</h2></div>
    <div class="swatch-row">${COLORS.map(c=>`<span class="swatch ${p.preferences.favoriteColors.includes(c.id)?'selected':''}" style="background:${c.hex};" title="${c.label}" onclick="toggleProfileChip('favoriteColors','favoriteColors','${c.id}')"></span>`).join('')}</div>
  </div>
  <div class="card mt-4">
    <div class="section-title"><h2>Colors to avoid</h2></div>
    <div class="swatch-row">${COLORS.map(c=>`<span class="swatch ${p.preferences.avoidColors.includes(c.id)?'selected':''}" style="background:${c.hex};" title="${c.label}" onclick="toggleProfileChip('avoidColors','avoidColors','${c.id}')"></span>`).join('')}</div>
  </div>
  <div class="card mt-4">
    <div class="section-title"><h2>Favorite styles</h2></div>
    <div class="row wrap" style="gap:8px;">${STYLE_IDS.map(s=>`<button class="chip small ${p.preferences.favoriteStyles.includes(s)?'selected':''}" onclick="toggleProfileChip('favoriteStyles','favoriteStyles','${s}')">${cap(s)}</button>`).join('')}</div>
  </div>

  ${insights.length? `
  <div class="card mt-4">
    <div class="section-title"><h2>Wardrobe insights</h2></div>
    <div style="display:flex;flex-direction:column;gap:14px;">
      ${insights.map(i=>`<div class="row" style="gap:12px;"><div style="width:34px;height:34px;border-radius:11px;background:var(--surface2);display:grid;place-items:center;color:var(--accent);flex-shrink:0;">${icon(i.icon)}</div><p class="small" style="line-height:1.5;">${esc(i.text)}</p></div>`).join('')}
    </div>
  </div>`:''}

  <div class="card mt-4">
    <div class="section-title"><h2>Account</h2></div>
    <div class="account-row"><span class="small muted">Name</span><span class="small bold">${esc(p.name||authUserName())}</span></div>
    <div class="account-row"><span class="small muted">Email</span><span class="small bold" style="text-align:right;word-break:break-all;">${esc((AUTH.user&&AUTH.user.email)||'')}</span></div>
    <button class="btn btn-danger btn-block mt-4" onclick="signOutFitPick()">Sign Out</button>
  </div>

  <div class="card mt-4">
    <div class="section-title"><h2>Appearance</h2></div>
    <button class="btn btn-secondary btn-block" onclick="toggleTheme()">${icon(p.theme==='light'?'moon':'sun')} Switch to ${p.theme==='light'?'dark':'light'} mode</button>
  </div>

  <div class="card mt-4">
    <div class="section-title"><h2>Data</h2></div>
    <p class="small muted" style="margin-bottom:12px;">Wardrobe data in this single-file build is stored only in this browser and separated by signed-in account.</p>
    
    <button class="btn btn-danger btn-block" onclick="clearAllDataConfirm()">${icon('trash')} Clear all data</button>
  </div>
  `;
}

/* =========================================================================
   Init
   ========================================================================= */
async function init(){
  document.documentElement.dataset.theme = 'dark';
  if(!location.hash) location.hash = '#/auth';
  await initAuth();
}
document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
